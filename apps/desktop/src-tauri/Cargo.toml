[package]
name = "mcgit-desktop"
version = "0.1.0"
description = "mcgit — Minecraft launcher"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mcgit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
mcgit-java = { path = "../../../crates/mcgit-java" }
mcgit-db = { path = "../../../crates/mcgit-db" }
mcgit-minecraft = { path = "../../../crates/mcgit-minecraft" }
mcgit-instance = { path = "../../../crates/mcgit-instance" }
mcgit-core = { path = "../../../crates/mcgit-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }

